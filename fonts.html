<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <style>
        .serif {
            font-family: 'Times New Roman', Times, serif;
        }
        .sans-serif {
            font-family: Arial, Helvetica, sans-serif;
        }
        .monospace {
            font-family: 'Courier New', Courier, monospace;

        }


        
        
    </style
</head>
<body>
    <h1>Fonts with CSS</h1>
    <p class="serif">This paragraph uses a serif font.</p>
    <p class="sans-serif">This paragraph uses a sans-serif font.</p>
    <p class="monospace">This paragraph uses a monospace font.</p>
    <h2>more fonts</h2>
    <p style="font-family: 'Georgia', serif;">This paragraph uses the Georgia font.</p>
    <p style="font-family: 'Verdana', sans-serif;">This paragraph uses the Verdana font.</p>
    <p style="font-family: 'Lucida Console', monospace;">This paragraph uses the Lucida Console font.</p>


</body>
</html>
